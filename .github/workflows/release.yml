name: Release

# Push a tag like v0.1.0 (or run manually) to build the Windows installer
# and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed apps accept it (key made with `tauri signer generate`).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Free Stuff Hub ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Download **Free Stuff Hub_x.y.z_x64-setup.exe** below and run it. No admin rights needed; it adds desktop and Start menu shortcuts.

            Read the ToS warning in the README before using the planned Discord / Twitch modules.
          includeUpdaterJson: true
          # Updater artifacts (signed installer + latest.json) only in CI, so local builds need no key.
          args: --config src-tauri/tauri.release.conf.json
          releaseDraft: false
          prerelease: false
